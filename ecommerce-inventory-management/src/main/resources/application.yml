spring:
  application:
    name: ecommerce-inventory-management

  datasource:
    url: jdbc:postgresql://localhost:5433/ecommerce_db
    username: postgres
    password: 9890
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update        # dev-friendly; use Flyway/Liquibase in prod
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
    # show-sql: true          # uncomment to log SQL in console
